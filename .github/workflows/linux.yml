name: Linux paketleri

# Builds the AppImage, .deb and Arch .pacman package on Ubuntu (they cannot be produced on Windows) and attaches them to the release.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Paketlerin ekleneceği sürüm etiketi (ör. v1.8.0)
        required: true

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # electron-builder needs bsdtar for the pacman package.
      - run: sudo apt-get install -y libarchive-tools
      - run: npm ci
      - run: npm test
      - run: npm run build:integrations
      - run: npm run build
      - run: npx electron-builder --linux AppImage deb pacman --x64 --publish never
      - name: Sürüme ekle
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" release-dubbitig/*.AppImage release-dubbitig/*.deb release-dubbitig/*.pacman --clobber
